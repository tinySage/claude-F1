name: tests

on:
  push:
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run --with ruff ruff check src tests notebooks
      - name: Fast tests (slow and network tests are deselected by default)
        run: uv run pytest -q
