[project]
name = "f1strat"
version = "0.1.0"
description = "F1 race strategy simulator re-examining Ferrari's 2022 strategy calls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arviz>=0.23.4",
    "fastf1>=3.9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "nutpie>=0.16.8",
    "pandas>=2.3.3",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pymc>=5.28.5",
    "scikit-learn>=1.9.1",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1strat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]
